[tox]
isolated_build = True
envlist =
    py311
    py312
    ruff
    coverage

[gh-actions]
python =
    3.11: py311
    3.12: py312, ruff

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1
basepython =
    py311: python3.11
    py312: python3.12
    .package: python3
allowlist_externals = poetry
commands =
    poetry install -v --extras "django-query"
    poetry run pytest tests/

[testenv:ruff]
basepython =
    python3.12
commands =
    poetry install -v --extras "django-query"
    poetry run ruff check src
    poetry run ruff format --check --diff src

[testenv:coverage]
basepython =
    python3.12
commands =
    poetry install -v --extras "django-query"
    poetry run pytest --cov=scim2_filter_parser --cov-report=xml --cov-report=term
